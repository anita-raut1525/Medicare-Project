apiVersion: apps/v1
kind: Deployment
metadata:
  name: medicare-frontend
  namespace: medicare-dev
  labels:
    app: medicare-frontend
    environment: dev
    project: medicare

spec:
  replicas: 2

  selector:
    matchLabels:
      app: medicare-frontend

  template:
    metadata:
      labels:
        app: medicare-frontend
        environment: dev

    spec:
      containers:
        - name: medicare-frontend
          image: PLACEHOLDER_ECR_FRONTEND_IMAGE

          ports:
            - containerPort: 80
