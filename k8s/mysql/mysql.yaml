apiVersion: v1
kind: Secret
metadata:
  name: medicare-mysql-secret
  namespace: medicare-dev
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: root123
  MYSQL_USER: medicareuser
  MYSQL_PASSWORD: medicare123

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: medicare-mysql-config
  namespace: medicare-dev
data:
  MYSQL_DATABASE: Medicare

---
apiVersion: v1
kind: Service
metadata:
  name: medicare-mysql
  namespace: medicare-dev
spec:
  selector:
    app: medicare-mysql
  ports:
    - port: 3306
      targetPort: 3306

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medicare-mysql
  namespace: medicare-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medicare-mysql
  template:
    metadata:
      labels:
        app: medicare-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medicare-mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: medicare-mysql-config
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: medicare-mysql-secret
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medicare-mysql-secret
                  key: MYSQL_PASSWORD