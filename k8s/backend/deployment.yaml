apiVersion: apps/v1
kind: Deployment
metadata:
  name: medicare-backend
  namespace: medicare-dev
  labels:
    app: medicare-backend
    environment: dev
    project: medicare
spec:
  replicas: 2

  selector:
    matchLabels:
      app: medicare-backend

  template:
    metadata:
      labels:
        app: medicare-backend
        environment: dev
    spec:
      containers:
        - name: medicare-backend
          image: anitaraut/medicare-backend:v3
          ports:
            - containerPort: 8082

          env:
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: medicare-backend-config
                  key: SERVER_PORT

            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: medicare-backend-config
                  key: DB_HOST

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: medicare-backend-config
                  key: DB_PORT

            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: medicare-backend-config
                  key: DB_NAME

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: medicare-backend-secret
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medicare-backend-secret
                  key: DB_PASSWORD
